<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bairro em Dia</title>
    <script src="https://jsdelivr.net"></script>
    <script src="https://tailwindcss.com"></script>
    <style>
        body { background-color: #f5f3ef; font-family: sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="pb-16">

    <!-- FEED MORADOR -->
    <div id="feed-tab" class="tab-content active p-4">
        <h1 class="text-2xl font-bold text-green-800 mb-4">Bairro em Dia</h1>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700">Escolha o Bairro:</label>
            <select id="bairro-select" class="mt-1 block w-full rounded-md border-gray-300 p-2 bg-white border" onchange="renderFeed()">
                <option value="Tatuapé">Tatuapé</option>
                <option value="Ipiranga">Ipiranga</option>
            </select>
        </div>
        <div id="offers-container" class="space-y-4"></div>
    </div>

    <!-- PAINEL LOJISTA -->
    <div id="lojista-tab" class="tab-content p-4">
        <h2 class="text-xl font-bold text-green-800 mb-4">Painel do Lojista</h2>
        <div class="bg-white p-4 rounded-lg shadow-sm mb-4 border">
            <h3 class="font-semibold mb-2">Nova Oferta (Máx 3 ativas)</h3>
            <input id="off-title" type="text" placeholder="Título da Oferta" class="w-full p-2 mb-2 border rounded">
            <input id="off-desc" type="text" placeholder="Descrição" class="w-full p-2 mb-2 border rounded">
            <button onclick="addOferta()" class="w-full bg-green-600 text-white p-2 rounded font-bold">Publicar Oferta</button>
        </div>
        <div id="minhas-ofertas" class="space-y-2"></div>
    </div>

    <!-- SIMULADOR TRIBUTÁRIO -->
    <div id="tributos-tab" class="tab-content p-4">
        <h2 class="text-xl font-bold text-green-800 mb-4">Simulador Reforma Tributária</h2>
        <div class="bg-white p-4 rounded-lg shadow-sm border space-y-3">
            <div>
                <label class="block text-sm font-medium text-gray-700">Custo do Produto (R$)</label>
                <input id="calc-custo" type="number" value="100" class="w-full p-2 border rounded" oninput="calcularTributos()">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Margem Desejada (%)</label>
                <input id="calc-margem" type="number" value="30" class="w-full p-2 border rounded" oninput="calcularTributos()">
            </div>
            <div class="p-3 bg-green-50 rounded border border-green-200 space-y-1">
                <p class="text-sm">Preço Mínimo Atual (29.25% imposto): <strong id="preco-atual">R$ 0,00</strong></p>
                <p class="text-sm">Preço Mínimo 2027 (15.90% imposto): <strong id="preco-2027">R$ 0,00</strong></p>
                <p class="text-sm text-green-700 font-bold">Economia Estimada: <span id="economia-val">R$ 0,00</span></p>
            </div>
            <p class="text-xs text-gray-400 text-center mt-2">Estimativa para decisão, não orientação tributária.</p>
        </div>
    </div>

    <!-- ABAS INFERIORES -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-2 text-center text-xs text-gray-600 shadow-lg">
        <button onclick="switchTab('feed')" class="flex flex-col items-center text-green-700 font-bold"><span>📱</span><span>Feed</span></button>
        <button onclick="switchTab('lojista')" class="flex flex-col items-center"><span>🏪</span><span>Lojista</span></button>
        <button onclick="switchTab('tributos')" class="flex flex-col items-center"><span>📊</span><span>Tributos</span></button>
    </div>

    <script>
        // Banco de dados simulado no navegador
        if(!localStorage.getItem('ofertas')) {
            localStorage.setItem('ofertas', JSON.stringify([
                {id: 1, bairro: 'Tatuapé', titulo: 'Pastel + Caldo de Cana', desc: 'Na feira de terça do Tatuapé', loja: 'Pastelaria do Bairro'},
                {id: 2, bairro: 'Ipiranga', titulo: 'Troca de Óleo com Desconto', desc: 'Válido até sexta-feira', loja: 'Auto Mecânica Centro'}
            ]));
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tab + '-tab').classList.add('active');
        }

        function renderFeed() {
            const bairro = document.getElementById('bairro-select').value;
            const ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
            const container = document.getElementById('offers-container');
            container.innerHTML = '';
            
            ofertas.filter(o => o.bairro === bairro).forEach(o => {
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border">
                        <span class="text-xs font-bold text-green-600 uppercase">${o.loja}</span>
                        <h3 class="text-lg font-bold text-gray-800">${o.titulo}</h3>
                        <p class="text-sm text-gray-600 mb-3">${o.desc}</p>
                        <button onclick="alert('Cupom resgatado! Código: ' + Math.floor(100000 + Math.random() * 900000))" class="w-full bg-green-700 text-white p-2 rounded text-sm font-semibold">Resgatar Cupom</button>
                    </div>`;
            });
        }

        function addOferta() {
            const titulo = document.getElementById('off-title').value;
            const desc = document.getElementById('off-desc').value;
            const bairro = document.getElementById('bairro-select').value;
            if(!titulo || !desc) return alert('Preencha os campos!');
            
            const ofertas = JSON.parse(localStorage.getItem('ofertas')) || [];
            ofertas.push({id: Date.now(), bairro: bairro, titulo: titulo, desc: desc, loja: 'Minha Loja Local'});
            localStorage.setItem('ofertas', JSON.stringify(ofertas));
            
            document.getElementById('off-title').value = '';
            document.getElementById('off-desc').value = '';
            renderFeed();
            alert('Oferta publicada com sucesso no bairro ' + bairro + '!');
        }

        function calcularTributos() {
            const custo = parseFloat(document.getElementById('calc-custo').value) || 0;
            const margem = parseFloat(document.getElementById('calc-margem').value) || 0;
            
            const pAtual = (custo * (1 + margem/100)) / (1 - 0.2925);
            const p2027 = (custo * (1 + margem/100)) / (1 - 0.1590);
            const economia = pAtual - p2027;

            document.getElementById('preco-atual').innerText = 'R$ ' + pAtual.toFixed(2).replace('.', ',');
            document.getElementById('preco-2027').innerText = 'R$ ' + p2027.toFixed(2).replace('.', ',');
            document.getElementById('economia-val').innerText = 'R$ ' + (economia > 0 ? economia.toFixed(2).replace('.', ',') : '0,00');
        }

        renderFeed();
        calcularTributos();
    </script>
</body>
          </html>
